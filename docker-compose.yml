name: osk-management-lp

services:
  landing:
    build: .
    container_name: osk-management-lp
    restart: unless-stopped
    ports:
      - "8091:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
