server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Fingerprint-free asset names, so screenshots and fonts are revalidated
    # rather than cached forever: a refreshed screenshot must reach visitors.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
